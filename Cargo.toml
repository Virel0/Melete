[package]
name = "melete"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "=1.0.104"
argon2 = "=0.6.0"
axum = "=0.8.9"
base64 = "=0.23.1"
# Guessing the encoding of subtitle files that aren't UTF-8 (Firefox's detector), and
# decoding them.
chardetng = "=1.0.0"
encoding_rs = "=0.8.42"
fancy-regex = "=0.19.2"
futures-util = { version = "=0.3.34", default-features = false }
getrandom = "=0.4.3"
libc = "=0.2.191"
quick-xml = "=0.42.0"
regex = "=1.13.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "query", "form"] }
russh = { version = "=0.64.1", default-features = false, features = ["aws-lc-rs"] }
russh-sftp = "=3.0.1"
scraper = { version = "=0.29.0", default-features = false }
# Reads music tags and audio properties in-process (ID3, Vorbis comments, MP4 atoms, APE).
lofty = "=0.25.4"
# Reading Japanese lyrics (kanji in context) for their pronunciation, with the IPADIC
# dictionary built in; its build fetches the dictionary once and checks its MD5.
lindera = { version = "=6.2.0", default-features = false, features = ["embed-ipadic"] }
# Folding accents (NFD) when matching imported track lists.
unicode-normalization = "=0.1.26"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
sha1 = "=0.11.0"
sha2 = "=0.11.1"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "process", "time"] }
# Handing each request to the API as it's set up now (live); axum brings it in already.
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "=0.7.1", features = ["fs"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "=0.1.5"
tempfile = "=3.27.0"
