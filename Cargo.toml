[package]
name = "melete"
version = "0.10.0"
edition = "2024"
rust-version = "1.99"
publish = false
default-run = "melete"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "=1.0.104"
argon2 = "=0.6.0"
# AES-256-GCM for sealing stored secrets. Already in the build through rustls and russh, at
# this version and with these features: naming it adds no crate.
aws-lc-rs = { version = "=1.19.0", default-features = false, features = ["aws-lc-sys", "alloc"] }
axum = "=0.8.9"
# Bytes for the tunnel's packets, as WireGuard's library takes them; in the build already.
bytes = "=1.12.1"
base64 = "=0.23.1"
# Guessing the encoding of subtitle files that aren't UTF-8 (Firefox's detector), and
# decoding them.
chardetng = "=1.0.0"
encoding_rs = "=0.8.44"
fancy-regex = "=0.20.2"
futures-util = { version = "=0.3.34", default-features = false }
getrandom = "=0.4.3"
# WireGuard in userspace, for the tunnel (`tunnel`): Mullvad's fork of BoringTun, MPL-2.0. Its
# own UDP socket and no TUN device; its crypto through aws-lc-rs, as the rest of the build.
gotatun = { version = "=0.10.3", default-features = false, features = ["device", "aws-lc-rs"] }
# The addresses a tunnel peer may send from, as WireGuard's library takes them.
ipnetwork = "=0.21.1"
# HMAC-SHA1 for two-factor codes (RFC 6238). Already in the build through russh, at this version.
hmac = "=0.13.0"
# A plain connection through the proxy, for the seedbox's SFTP: hyper-util's SOCKS5 and HTTP
# CONNECT handshakes, and TLS to an HTTPS proxy, checked as reqwest checks it. All in the build
# already through reqwest, at these versions and with these features: naming them adds no crate.
http = "=1.5.0"
# Reading the body of a request to the ACME CA, as instant-acme hands it over; in the build
# already through axum.
http-body-util = "=0.1.5"
# Reading when an issued certificate runs out and the names it holds; in the build already
# through instant-acme, at this version.
x509-parser = "=0.18.1"
# HTTPS served by Melete itself: hyper's HTTP/1.1 server under the TLS listener (src/tls.rs).
hyper = { version = "=1.12.0", default-features = false, features = ["server", "http1"] }
# Getting HTTPS's certificate from an ACME CA (src/acme): RFC 8555 with renewal information
# (RFC 9773) and profiles. Its own HTTP client off: requests go through the reqwest below.
instant-acme = { version = "=0.8.5", default-features = false, features = ["aws-lc-rs", "time", "x509-parser"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["client-legacy", "client-proxy", "tokio", "server", "http1", "service"] }
libc = "=0.2.191"
quick-xml = "=0.42.0"
# The key and signing request of each certificate Melete asks an ACME CA for, and a stand-in
# certificate while HTTPS waits for the first one. In the build already through instant-acme.
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
regex = "=1.13.2"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "query", "form", "socks"] }
# Email alerts to admins (SMTP with STARTTLS or TLS through rustls and aws-lc-rs, as the rest
# of the build). No hostname feature: the greeting doesn't name the server.
lettre = { version = "=0.11.24", default-features = false, features = ["smtp-transport", "builder", "tokio1-rustls", "aws-lc-rs", "rustls-platform-verifier"] }
# A tunnel invite's WireGuard config as a QR code, drawn as SVG on the server for the page; no
# image library, no dependencies of its own.
qrcode = { version = "=0.14.1", default-features = false, features = ["svg"] }
russh = { version = "=0.65.2", default-features = false, features = ["aws-lc-rs"] }
russh-sftp = "=3.0.1"
rustls = { version = "=0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
rustls-platform-verifier = "=0.7.1"
scraper = { version = "=0.29.0", default-features = false }
# Reads music tags and audio properties in-process (ID3, Vorbis comments, MP4 atoms, APE).
lofty = "=0.25.5"
# Reading Japanese lyrics (kanji in context) for their pronunciation, with the IPADIC
# dictionary built in; its build fetches the dictionary once and checks its MD5.
lindera = { version = "=6.2.0", default-features = false, features = ["embed-ipadic"] }
# Folding accents (NFD) when matching imported track lists.
unicode-normalization = "=0.1.26"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
sha1 = "=0.11.0"
sha2 = "=0.11.1"
# The tunnel's TCP/IP in userspace: IPv4 and TCP only, nothing routed or forwarded.
smoltcp = { version = "=0.14.0", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp"] }
sqlx = { version = "=0.9.1", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "process", "time"] }
tokio-rustls = { version = "=0.26.6", default-features = false }
# Handing each request to the API as it's set up now (live); axum brings it in already.
# Writing to a tunnel connection's channel from AsyncWrite; in the build already.
tokio-util = { version = "=0.7.20", default-features = false }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "=0.7.1", features = ["fs"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

[dev-dependencies]
# Throwaway certificates for the HTTPS tests, and a stand-in CA signing what it's asked to.
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "pem", "aws_lc_rs", "x509-parser"] }
# Reading back the QR codes Melete draws, as a phone would.
rqrr = { version = "=0.10.1", default-features = false }
tempfile = "=3.27.0"
