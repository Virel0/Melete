name: Feature request
description: Something Melete should do that it doesn't.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The task or problem, as you meet it. What does Melete do today, and where does it fall short?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could work. Mention how Jellyfin or one of the *arrs does it, if that helps.
  - type: textarea
    id: outside
    attributes:
      label: Outside services
      description: |
        Would this send anything beyond the server (a new service, a lookup, a download)? If so,
        what would leave, and who would see it? Melete keeps every outside service off by default.
  - type: textarea
    id: more
    attributes:
      label: Anything else
