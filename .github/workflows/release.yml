name: Release

# A release is a container image on GitHub's container registry, built here from a v* tag.
# The build job has a read-only token and only makes an OCI archive with its SHA-256. The
# publish job builds nothing: it checks that checksum, pushes the archive as it is, attests its
# build provenance, and makes the GitHub release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to build again, such as v0.1.0 (no new version is made)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # BuildKit for the docker-container builder, which can write an OCI archive.
  BUILDKIT_IMAGE: moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Read the tag
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not a version tag such as v1.2.3"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          persist-credentials: false

      - name: Check the version
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$cargo_version" != "$VERSION" ]; then
            echo "::error::the tag says $VERSION but Cargo.toml says $cargo_version"
            exit 1
          fi

      - name: Set up the builder
        run: |
          docker buildx create --name release --driver docker-container \
            --driver-opt "image=$BUILDKIT_IMAGE" --use
          docker buildx inspect --bootstrap

      - name: Build the image
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION"
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          mkdir -p dist
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --label "org.opencontainers.image.source=$SOURCE_URL" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.licenses=GPL-3.0-or-later" \
            --output "type=oci,dest=dist/melete-$VERSION.oci.tar,name=$image,rewrite-timestamp=true" \
            .
          cd dist
          sha256sum "melete-$VERSION.oci.tar" > SHA256SUMS
          cat SHA256SUMS

      - name: Upload the archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # the GitHub release
      packages: write # the image on ghcr.io
      id-token: write # signing the attestation
      attestations: write
    env:
      TAG: ${{ needs.build.outputs.tag }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Download the archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: dist

      - name: Verify the checksum
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS

      - name: Sign in to the registry
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Push the image
        id: push
        run: |
          if ! command -v skopeo > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends skopeo
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          # The archive goes up as it is, so the pushed digest is the one built and checked.
          skopeo copy --preserve-digests --digestfile dist/digest \
            "oci-archive:dist/melete-$VERSION.oci.tar" "docker://$image:$VERSION"
          digest=$(cat dist/digest)
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::unexpected digest: $digest"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Pushed $image:$VERSION@$digest"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Sign the checksums
        working-directory: dist
        env:
          RELEASE_GPG_KEY: ${{ secrets.RELEASE_GPG_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          if [ -z "$RELEASE_GPG_KEY" ]; then
            echo "No RELEASE_GPG_KEY secret: the checksums are not signed."
            exit 0
          fi
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          trap 'rm -rf "$GNUPGHOME"' EXIT
          echo "$RELEASE_GPG_KEY" | gpg --batch --quiet --import
          if [ -n "$RELEASE_GPG_PASSPHRASE" ]; then
            echo "$RELEASE_GPG_PASSPHRASE" | gpg --batch --pinentry-mode loopback --passphrase-fd 0 \
              --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS
          else
            gpg --batch --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS
          fi
          gpg --batch --verify SHA256SUMS.asc SHA256SUMS

      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.push.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cat > notes.md <<EOF
          The image, pinned by its digest:

          \`\`\`
          $IMAGE:$VERSION@$DIGEST
          \`\`\`

          Check that it was built by this repository's release workflow:

          \`\`\`
          gh attestation verify oci://$IMAGE:$VERSION@$DIGEST --owner $GITHUB_REPOSITORY_OWNER
          \`\`\`

          \`SHA256SUMS\` holds the SHA-256 of the image archive attached here, the same image as
          an OCI archive (\`docker load\` or \`skopeo\` can read it). The changes are in CHANGELOG.md.
          EOF
          files=(dist/SHA256SUMS "dist/melete-$VERSION.oci.tar")
          if [ -f dist/SHA256SUMS.asc ]; then
            files+=(dist/SHA256SUMS.asc)
          fi
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # A tag built again: same release, new image and files.
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Melete $VERSION" --notes-file notes.md "${prerelease[@]}" "${files[@]}"
          fi
