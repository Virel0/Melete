# A VPN beside Melete: Gluetun, which Soulseek (compose.soulseek.yaml), the trailer downloader
# (compose.trailers.yaml) and the services Melete sends through a proxy share. Off unless added
# to compose.yaml in .env, before the files that use it:
#   COMPOSE_FILE=compose.yaml:compose.vpn.yaml:compose.soulseek.yaml
# Gluetun's firewall lets nothing out while the tunnel is down. Nothing here publishes a port:
# inside compose, Melete reaches its HTTP proxy at gluetun:8888 (Settings, Outside services,
# Proxy) and its control server at http://gluetun:8000 (Settings, Outside services, VPN).
# Melete has no Docker socket: restarting or changing this container is compose's to do.

services:
  gluetun:
    image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    container_name: melete-gluetun
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    # The VPN provider and its keys (see .env.example): a file of its own, never committed.
    env_file:
      - path: ${MELETE_GLUETUN_ENV_FILE:?set MELETE_GLUETUN_ENV_FILE in .env}
    environment:
      # Its HTTP proxy, for the services Melete sends through it; with a login, so only what
      # has it can use the tunnel.
      HTTPPROXY: "on"
      HTTPPROXY_USER: melete
      HTTPPROXY_PASSWORD: ${MELETE_GLUETUN_PROXY_PASSWORD:?set MELETE_GLUETUN_PROXY_PASSWORD in .env}
      # No X-Forwarded-For or Via headers naming Melete's address inside compose on plain-http
      # requests: the sites see the tunnel's address and nothing more.
      HTTPPROXY_STEALTH: "on"
    volumes:
      # Who may use which control-server route, each with a key of its own
      # (gluetun-roles.example.toml). With it mounted, no route answers without a key.
      - ${MELETE_GLUETUN_ROLES_FILE:?set MELETE_GLUETUN_ROLES_FILE in .env}:/gluetun/auth/config.toml:ro
    security_opt:
      - no-new-privileges:true
